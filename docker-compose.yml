# Sobe o bot:          docker compose up -d --build
# Ver o QR e o log:    docker compose logs -f
services:
  chamados:
    build: .
    env_file:
      - path: .env
        required: false
    volumes:
      - estado:/app/estado   # sessão do WhatsApp + mensagens salvas + relatórios
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  estado:
